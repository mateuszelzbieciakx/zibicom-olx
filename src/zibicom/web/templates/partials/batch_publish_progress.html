<div id="batch-publish"
     hx-get="/ui/batches/{{ batch_id }}/publish-progress"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
    <div class="text-sm text-slate-500 mb-1">Publikowanie na OLX... {{ done }}/{{ total }}</div>
    <div class="w-full bg-slate-200 rounded h-2 overflow-hidden">
        <div class="bg-emerald-700 h-2" style="width: {{ percent }}%"></div>
    </div>
</div>
