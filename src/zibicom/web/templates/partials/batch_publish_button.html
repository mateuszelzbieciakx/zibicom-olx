<div id="batch-publish">
    <button type="button"
            hx-post="/ui/batches/{{ batch_id }}/publish-all"
            hx-target="#batch-publish"
            hx-swap="outerHTML"
            hx-disabled-elt="this"
            hx-confirm="Opublikować wszystkie gotowe pozycje ({{ publishable_count }})? Każda publikacja to prawdziwe ogłoszenie na koncie firmowym OLX - OLX nie ma środowiska testowego, operacja jest nieodwracalna."
            class="px-3 py-1 bg-emerald-700 text-white rounded text-sm disabled:opacity-50">
        Publikuj wszystkie ({{ publishable_count }})
    </button>
</div>
