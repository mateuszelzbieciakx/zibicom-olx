[project]
name = "zibicom-olx"
version = "0.1.0"
description = "Synchronizacja inwentarza sklepu z grami wideo z ogloszeniami OLX."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "boto3>=1.43.79",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "google-genai>=2.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zibicom"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ANN",  # type hints wymagane
    "D",    # docstringi
]
ignore = [
    "D203",  # konflikt z D211
    "D213",  # konflikt z D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]  # testy nie wymagaja docstringow

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
